<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f2f4f7;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }

  .box {
    width: 100%;
    max-width: 340px;
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    padding: 32px 28px;
    text-align: center;
  }

  h1 {
    font-size: 20px;
    margin: 0 0 6px;
    color: #1a1a1a;
  }

  p.subtitle {
    margin: 0 0 22px;
    color: #777;
    font-size: 13.5px;
  }

  input {
    width: 100%;
    padding: 11px 12px;
    margin-bottom: 12px;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-size: 14px;
    outline: none;
  }

  input:focus {
    border-color: #4a7dff;
  }

  button {
    width: 100%;
    padding: 11px 0;
    border: none;
    border-radius: 6px;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 4px;
  }

  .btn-primary {
    background: #4a7dff;
    color: #fff;
  }
  .btn-primary:hover { background: #3a6ae0; }

  .btn-secondary {
    background: #f0f0f0;
    color: #333;
  }
  .btn-secondary:hover { background: #e2e2e2; }

  .error {
    color: #d33;
    font-size: 12.5px;
    min-height: 16px;
    margin: -4px 0 8px;
  }

  .hidden { display: none; }

  .avatar {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: #4a7dff;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: 600;
    margin: 0 auto 14px;
  }

  .welcome-name {
    font-weight: 600;
    color: #1a1a1a;
  }
</style>
</head>
<body>

<div class="box">

  <!-- Signed OUT view -->
  <div id="signedOutView">
    <h1>Sign in</h1>
    <p class="subtitle">Enter your details to continue</p>

    <form id="loginForm">
      <input type="email" id="email" placeholder="Email" autocomplete="email">
      <input type="password" id="password" placeholder="Password" autocomplete="current-password">
      <div class="error" id="loginError"></div>
      <button type="submit" class="btn-primary">Sign In</button>
    </form>
  </div>

  <!-- Signed IN view -->
  <div id="signedInView" class="hidden">
    <div class="avatar" id="avatarLetter">?</div>
    <h1>Welcome, <span class="welcome-name" id="welcomeName"></span></h1>
    <p class="subtitle">You're signed in</p>
    <button class="btn-secondary" id="signOutBtn">Sign Out</button>
  </div>

</div>

<script>
  const loginForm = document.getElementById('loginForm');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const loginError = document.getElementById('loginError');

  const signedOutView = document.getElementById('signedOutView');
  const signedInView = document.getElementById('signedInView');
  const welcomeName = document.getElementById('welcomeName');
  const avatarLetter = document.getElementById('avatarLetter');
  const signOutBtn = document.getElementById('signOutBtn');

  loginForm.addEventListener('submit', function(e) {
    e.preventDefault();
    const email = emailInput.value.trim();
    const password = passwordInput.value;

    if (!email || !password) {
      loginError.textContent = 'Please enter both email and password.';
      return;
    }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      loginError.textContent = 'Please enter a valid email address.';
      return;
    }

    loginError.textContent = '';

    // Show signed-in state
    const namePart = email.split('@')[0];
    welcomeName.textContent = namePart;
    avatarLetter.textContent = namePart.charAt(0).toUpperCase();

    signedOutView.classList.add('hidden');
    signedInView.classList.remove('hidden');
  });

  signOutBtn.addEventListener('click', function() {
    emailInput.value = '';
    passwordInput.value = '';
    loginError.textContent = '';
    signedInView.classList.add('hidden');
    signedOutView.classList.remove('hidden');
  });
</script>

</body>
</html>
